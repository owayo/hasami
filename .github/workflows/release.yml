name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual release)'
        type: boolean
        default: false

# 書き込みが要るジョブ（版のコミットとタグの push、Release の作成）にだけ contents: write を与える
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: hasami
  # mise.lock にない版を解決させず、mise.lock を書き換えさせない
  MISE_LOCKED: "1"

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # push できるジョブなので、取得するツールを cargo update に要る rust だけにする（mise は名指しでは
      # 絞れない）。名前は mise.toml の書き方のまま書く。mise.toml にツールを足したらここにも足す
      MISE_DISABLE_TOOLS: python,aqua:astral-sh/uv,github:PyO3/maturin,cargo:https://github.com/cross-rs/cross
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 版を Cargo.lock に写す cargo update も mise.toml の版の Rust で行う
      - uses: ./.github/actions/setup-mise
        with:
          tools: rust

      - name: Bump version
        id: bump
        run: |
          # Use 2-digit year (YY) for Windows MSI compatibility (major version must be <= 255)
          YEAR=$(date +%y)
          MONTH=$(date +%-m)

          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Current version: ${CURRENT}"

          if echo "${CURRENT}" | grep -qE '^[0-9]{2,4}\.[0-9]{1,2}\.[0-9]+$'; then
            OLD_YEAR=$(echo "${CURRENT}" | cut -d. -f1)
            OLD_MONTH=$(echo "${CURRENT}" | cut -d. -f2)
            OLD_COUNTER=$(echo "${CURRENT}" | cut -d. -f3)
            # Handle both 2-digit and 4-digit year formats
            OLD_YEAR_2DIGIT=${OLD_YEAR#20}
            if [ "${OLD_YEAR_2DIGIT}" = "${YEAR}" ] && [ "${OLD_MONTH}" = "${MONTH}" ]; then
              NEW_COUNTER=$((OLD_COUNTER + 1))
            else
              NEW_COUNTER=100
            fi
          else
            NEW_COUNTER=100
          fi

          NEW_VERSION="${YEAR}.${MONTH}.${NEW_COUNTER}"
          echo "New version: ${NEW_VERSION}"

          # Only replace the first occurrence (package version, not dependency versions)
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${NEW_VERSION}\"/" Cargo.toml

          # Sync only the package's own version into Cargo.lock. `cargo generate-lockfile`
          # would re-resolve every dependency to its newest release, shipping versions CI
          # never tested. Cargo.lock is committed, so the builds also pass --locked.
          if [ -f "Cargo.lock" ]; then
            cargo update --workspace
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git add Cargo.toml
          [ -f "Cargo.lock" ] && git add Cargo.lock || true

          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD "${{ steps.bump.outputs.tag }}"

      - name: Dry run info
        if: ${{ inputs.dry_run }}
        run: |
          echo "🧪 Dry run mode - skipping commit and tag"
          echo "Would release: ${{ steps.bump.outputs.tag }}"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hasami
            asset_name: hasami-x86_64-unknown-linux-gnu.tar.gz
            cross: false
            tools: rust

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: hasami
            asset_name: hasami-aarch64-unknown-linux-gnu.tar.gz
            cross: true
            tools: rust cargo:https://github.com/cross-rs/cross

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hasami
            asset_name: hasami-x86_64-apple-darwin.tar.gz
            cross: false
            tools: rust

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hasami
            asset_name: hasami-aarch64-apple-darwin.tar.gz
            cross: false
            tools: rust

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hasami.exe
            asset_name: hasami-x86_64-pc-windows-msvc.zip
            cross: false
            tools: rust

    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。ci.yml の build と同じく LF のまま取り、
      # 埋め込む例外表（include_str!）などの改行を CI で確かめたものとそろえる
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      # Rust と cross の版は mise.toml で固定する（ci.yml の build と同じ）
      - uses: ./.github/actions/setup-mise
        with:
          tools: ${{ matrix.tools }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # ビルドは cross のコンテナの中で行う（コンテナにクロスのコンパイラがある）
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      # CLI は文分割の例外表（辞書のデータに由来する）を埋め込んでいるので、ライセンスの文書と
      # 例外表の NOTICE を同梱する
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE LICENSE-APACHE-2.0 THIRD_PARTY_LICENSES.md src/sentence/builtin_exceptions.NOTICE target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }} LICENSE LICENSE-APACHE-2.0 THIRD_PARTY_LICENSES.md builtin_exceptions.NOTICE
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item LICENSE, LICENSE-APACHE-2.0, THIRD_PARTY_LICENSES.md, src/sentence/builtin_exceptions.NOTICE -Destination target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }} LICENSE LICENSE-APACHE-2.0 THIRD_PARTY_LICENSES.md builtin_exceptions.NOTICE
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # 配布辞書はタグのコミットから作り、artifact `dictionaries` に上げる (バイナリの build と並列に走る)
  dictionaries:
    name: Dictionaries
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/dict-build.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag }}

  release:
    name: Create Release
    needs: [prepare-release, build, dictionaries]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts

      # バイナリ 5 つ、配布辞書 3 つ (生のままと zstd で圧縮したもの)、目録、辞書のライセンスを release/ に
      # 平らに集め、過不足と目録の中身を確かめてから SHA256SUMS を作る
      - name: Prepare release files
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p release
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            if [ -e "release/$name" ]; then
              echo "::error::添付ファイルの名前が重なる: $name"
              exit 1
            fi
            mv "$f" "release/$name"
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.hsd' -o -name '*.hsd.zst' \
            -o -name dictionaries.json -o -name THIRD_PARTY_LICENSES.md \) -print0)

          expected=(
            hasami-x86_64-unknown-linux-gnu.tar.gz
            hasami-aarch64-unknown-linux-gnu.tar.gz
            hasami-x86_64-apple-darwin.tar.gz
            hasami-aarch64-apple-darwin.tar.gz
            hasami-x86_64-pc-windows-msvc.zip
            ipadic.hsd ipadic.hsd.zst
            ipadic-neologd.hsd ipadic-neologd.hsd.zst
            ipadic-neologd-sudachi.hsd ipadic-neologd-sudachi.hsd.zst
            dictionaries.json
            THIRD_PARTY_LICENSES.md
          )
          if ! diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(find release -type f -printf '%f\n' | LC_ALL=C sort); then
            echo "::error::release/ のファイルが期待する添付ファイルと一致しない"
            exit 1
          fi

          # 目録はこの版の hasami が作ったもので、載せた SHA-256 が添付するファイルと合う
          # (hasami dict download は目録の SHA-256 で確かめる)
          actual=$(jq -r .hasami_version release/dictionaries.json)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::dictionaries.json の hasami_version が $actual で、このリリースの版 $VERSION と一致しない"
            exit 1
          fi
          jq -r '.dictionaries[] | "\(.sha256)  \(.file)", "\(.compressed.sha256)  \(.compressed.file)"' \
            release/dictionaries.json | (cd release && sha256sum --check --strict -)

          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body: |
            ## hasami ${{ needs.prepare-release.outputs.version }}

            ### Installation

            #### Manual Download
            Download the appropriate binary for your platform and add it to your PATH.

            #### macOS (Apple Silicon)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/hasami-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv hasami /usr/local/bin/
            ```

            #### macOS (Intel)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/hasami-x86_64-apple-darwin.tar.gz | tar xz
            sudo mv hasami /usr/local/bin/
            ```

            #### Linux (x86_64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/hasami-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv hasami /usr/local/bin/
            ```

            #### Linux (ARM64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/hasami-aarch64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv hasami /usr/local/bin/
            ```

            #### Windows
            Download `hasami-x86_64-pc-windows-msvc.zip`, extract, and add to PATH.

            ### Dictionaries

            hasami needs a dictionary. The dictionaries are not in the repository; they are attached to this release.

            ```bash
            hasami dict download        # the recommended dictionary, into ~/.local/share/hasami/ (%LOCALAPPDATA%\hasami on Windows)
            hasami dict download --all  # all three dictionaries
            hasami tokenize "形態素解析のテスト"  # uses the downloaded dictionary when --dict is omitted
            ```

            | Dictionary | Contents |
            | --- | --- |
            | `ipadic` | IPAdic |
            | `ipadic-neologd` | IPAdic + NEologd |
            | `ipadic-neologd-sudachi` | IPAdic + NEologd + SudachiDict (recommended) |

            Each dictionary is attached as `<name>.hsd`. `<name>.hsd.zst` is the same dictionary compressed with zstd; `hasami dict download` fetches it and checks the SHA-256 after decompressing. `dictionaries.json` lists the dictionaries with their sizes and SHA-256, and `SHA256SUMS` covers every file of this release.

            To download a dictionary with curl and verify it:

            ```bash
            base=https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}
            curl -fL --remote-name-all "$base/ipadic-neologd-sudachi.hsd" "$base/SHA256SUMS"
            grep ' ipadic-neologd-sudachi.hsd$' SHA256SUMS | sha256sum --check --strict -
            ```

            The dictionaries contain data from IPAdic, mecab-ipadic-NEologd and SudachiDict. Their licenses are in `THIRD_PARTY_LICENSES.md`; distribute it together with the dictionaries when you redistribute them.

          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 公開した添付ファイルが release/ と名前・大きさ・状態まで一致するか (アップロードの取りこぼしを見つける)。
      # GitHub がアップロード時に計算した SHA-256 (digest) を返していれば、それも照らす
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/assets.json"
          find release -type f -printf '%f %s uploaded\n' | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          jq -r '.assets[] | "\(.name) \(.size) \(.state)"' "$RUNNER_TEMP/assets.json" | LC_ALL=C sort \
            > "$RUNNER_TEMP/published.txt"
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/published.txt"; then
            echo "::error::公開した添付ファイルが release/ のファイルと一致しない"
            exit 1
          fi

          jq -r '.assets[] | select(.digest != null) | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
            "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/published.sha256"
          if [ -s "$RUNNER_TEMP/published.sha256" ]; then
            (cd release && sha256sum --check --strict --quiet "$RUNNER_TEMP/published.sha256")
          else
            echo "::warning::GitHub が添付ファイルの digest を返さなかったので、SHA-256 の照合を省いた"
          fi

  release-summary:
    name: Release Summary
    needs: [prepare-release, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "🚀 Released ${{ needs.prepare-release.outputs.tag }}"
