# Run workflow 1 回で、版の更新からコミットとタグ、5 ターゲットのバイナリ、配布辞書、Release の作成までを行う。
#
# - prepare-release: 版を JST の yy.m.counter で決め、Cargo.toml と Cargo.lock をコミットしてタグを切る
# - build: ci.yml の build と同じ組（os / target）でバイナリを作る。dry_run では走らないので、
#   配布物を作れることは ci.yml の build で確かめる
# - dictionaries: タグのソースから配布辞書を作る（dict-build.yml を呼ぶ。build と並列に走る）
# - release: 添付を集めて SHA256SUMS を作り、Release を作って、公開した添付を照らし合わせる
# - release-summary: 結果を Summary に書く（dry_run を含め、途中のジョブが落ちても書く）
#
# Homebrew の tap と winget には配らない（配るなら update-homebrew / publish-winget のジョブを足す）
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compute the next version only; no commit, tag or release)"
        type: boolean
        default: false

# 書き込みはジョブ単位で与える（版のコミットとタグの push、Release の作成）
permissions:
  contents: read

# 同時に 2 つのリリースを走らせない（同じ番号を 2 回採る）。走っているものは止めない
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: hasami
  # mise.lock にない版を解決させず、mise.lock を書き換えさせない
  MISE_LOCKED: "1"

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # push できるジョブなので、取得するツールを cargo update に要る rust だけにする（mise は名指しでは
      # 絞れない）。名前は mise.toml の書き方のまま書く。mise.toml にツールを足したらここにも足す
      MISE_DISABLE_TOOLS: python,aqua:astral-sh/uv,github:PyO3/maturin
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # 本番は既定のブランチからだけ出す（ほかのブランチから出すと、既定のブランチに無いコミットにタグが付く）。
      # dry_run はどのブランチでも動くので、workflow の変更をブランチで試せる
      - name: Check the branch
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run the release from ${DEFAULT_BRANCH} (this run is on ${GITHUB_REF})"
            exit 1
          fi

      - uses: actions/checkout@v7

      # 版を Cargo.lock に写す cargo update も mise.toml の版の Rust で行う（無いとランナーに最初から入っている Rust で動く）
      - uses: ./.github/actions/setup-mise
        with:
          tools: rust

      - name: Bump the version
        id: bump
        run: |
          set -euo pipefail
          # 版は yy.m.counter。年は 2 桁（Windows の MSI は major が 255 以下）。月はゼロ埋めしない
          # （SemVer は数値の先頭の 0 を禁じ、Cargo は 26.08.100 を拒む）。連番は 100 から（桁がそろう）。
          # 採番は JST で切る。ランナーは UTC なので、素の date では JST の月初 0〜9 時のリリースが
          # 前の月の連番になる
          YEAR=$(TZ=Asia/Tokyo date +%y)
          MONTH=$(TZ=Asia/Tokyo date +%-m)
          CURRENT=$(awk -F '"' '/^version = /{ print $2; exit }' Cargo.toml)
          echo "Current version: ${CURRENT}"
          COUNTER=100
          if [[ "${CURRENT}" =~ ^([0-9]{2,4})\.([0-9]{1,2})\.([0-9]+)$ ]]; then
            # 4 桁の年（2026.9.105）の版からも続けて採番する
            if [ "${BASH_REMATCH[1]#20}" = "${YEAR}" ] && [ "${BASH_REMATCH[2]}" = "${MONTH}" ]; then
              COUNTER=$((BASH_REMATCH[3] + 1))
            fi
          fi
          VERSION="${YEAR}.${MONTH}.${COUNTER}"
          TAG="v${VERSION}"
          echo "Next version: ${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} already exists. Check the version in Cargo.toml against the existing tags"
            exit 1
          fi

          # [package] の version（ファイルで最初の `version = ` の行）だけを書き換える（依存の version は触らない）
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${VERSION}\"/" Cargo.toml
          test "$(awk -F '"' '/^version = /{ print $2; exit }' Cargo.toml)" = "${VERSION}"
          # Cargo.lock は自分のパッケージの版だけを合わせる（lockfile を作り直すと全依存が最新へ
          # 解決し直され、CI で確かめていない版が配布物に入る）。Cargo.lock はコミットしているので、
          # ビルドも --locked で行う
          cargo update --workspace
          git diff --stat

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          # ブランチとタグを 1 回で送る。--atomic で、ブランチが先に進んでいて片方だけが通ることを防ぐ
          git push --atomic origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${TAG}"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          echo "Dry run: would release ${TAG} (no commit, tag or release)"
          git diff -- Cargo.toml Cargo.lock

  build:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ci.yml の build と同じ組。Linux ARM64 は arm64 のランナーでそのままビルドする（クロスビルドをしない）
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。ci.yml の build と同じく LF のまま取り、
      # 埋め込む例外表（include_str!）などの改行を CI で確かめたものとそろえる
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      # ビルドのキャッシュ（rust-cache）は使わない。配布物を作るジョブがキャッシュを読むと、キャッシュを
      # 書けるほかのジョブの汚染が配布物に入る。Rust の版は mise.toml で固定する（ci.yml の build と同じ）
      - uses: ./.github/actions/setup-mise
        with:
          tools: rust

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 添付の名前は <bin>-<target>.tar.gz（Windows は .zip）で、バイナリを最上位に置く。CLI は文分割の
      # 例外表（辞書のデータに由来する）を埋め込んでいるので、ライセンスの文書と例外表の NOTICE も同梱する
      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAR_GZ: ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz
          ZIP: ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
        run: |
          set -euo pipefail
          cp LICENSE LICENSE-APACHE-2.0 THIRD_PARTY_LICENSES.md src/sentence/builtin_exceptions.NOTICE "target/${TARGET}/release/"
          docs=(LICENSE LICENSE-APACHE-2.0 THIRD_PARTY_LICENSES.md builtin_exceptions.NOTICE)
          cd "target/${TARGET}/release"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a "../../../${ZIP}" "${BINARY_NAME}.exe" "${docs[@]}"
            echo "asset=${ZIP}" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../../../${TAR_GZ}" "${BINARY_NAME}" "${docs[@]}"
            echo "asset=${TAR_GZ}" >> "$GITHUB_OUTPUT"
          fi

      # archive: false で添付のファイルをそのまま上げる（artifact の名前はファイル名になる）
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.asset }}
          archive: false
          if-no-files-found: error

  # 配布辞書はタグのコミットから作り、artifact `dictionaries` に上げる（バイナリの build と並列に走る）
  dictionaries:
    name: Dictionaries
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/dict-build.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag }}

  release:
    name: Release
    needs: [prepare-release, build, dictionaries]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      assets: ${{ steps.files.outputs.assets }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # バイナリ 5 つ、配布辞書 3 つ（生のままと zstd で圧縮したもの）、目録、辞書のライセンスを release/ に
      # 平らに集め、過不足と目録の中身を確かめてから SHA256SUMS を作る
      - name: Prepare the release files
        id: files
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            if [ -e "release/$name" ]; then
              echo "::error::Two artifacts have the same file name: $name"
              exit 1
            fi
            mv "$f" "release/$name"
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.hsd' -o -name '*.hsd.zst' \
            -o -name dictionaries.json -o -name THIRD_PARTY_LICENSES.md \) -print0)

          expected=(
            hasami-x86_64-unknown-linux-gnu.tar.gz
            hasami-aarch64-unknown-linux-gnu.tar.gz
            hasami-x86_64-apple-darwin.tar.gz
            hasami-aarch64-apple-darwin.tar.gz
            hasami-x86_64-pc-windows-msvc.zip
            ipadic.hsd ipadic.hsd.zst
            ipadic-neologd.hsd ipadic-neologd.hsd.zst
            ipadic-neologd-sudachi.hsd ipadic-neologd-sudachi.hsd.zst
            dictionaries.json
            THIRD_PARTY_LICENSES.md
          )
          if ! diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(find release -type f -printf '%f\n' | LC_ALL=C sort); then
            echo "::error::The files in release/ differ from the expected assets"
            exit 1
          fi

          # 目録はこの版の hasami が作ったもので、載せた SHA-256 が添付するファイルと合う
          # （hasami dict download は目録の SHA-256 で確かめる）
          actual=$(jq -r .hasami_version release/dictionaries.json)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::hasami_version in dictionaries.json is $actual, not the version of this release ($VERSION)"
            exit 1
          fi
          jq -r '.dictionaries[] | "\(.sha256)  \(.file)", "\(.compressed.sha256)  \(.compressed.file)"' \
            release/dictionaries.json | (cd release && sha256sum --check --strict -)

          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
          ls -la release/
          echo "assets=$(cd release && printf '%s ' *)" >> "$GITHUB_OUTPUT"

      # タイトルはタグ名だけ。本文は導入と辞書の手順で、変更点は generate_release_notes が後ろに足す
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body: |
            ## Install

            Download `${{ env.BINARY_NAME }}-<target>.tar.gz` for your platform from the assets below (`.zip` on Windows), extract it and put `${{ env.BINARY_NAME }}` on your `PATH`. `SHA256SUMS` lists the checksums of all assets.

            ```bash
            curl -fLO https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/${{ env.BINARY_NAME }}-aarch64-apple-darwin.tar.gz
            tar -xzf ${{ env.BINARY_NAME }}-aarch64-apple-darwin.tar.gz
            ```

            ## Dictionaries

            hasami needs a dictionary. The dictionaries are not in the repository; they are attached to this release.

            ```bash
            hasami dict download        # the recommended dictionary, into ~/.local/share/hasami/ (%LOCALAPPDATA%\hasami on Windows)
            hasami dict download --all  # all three dictionaries
            hasami tokenize "形態素解析のテスト"  # uses the downloaded dictionary when --dict is omitted
            ```

            | Dictionary | Contents |
            | --- | --- |
            | `ipadic` | IPAdic |
            | `ipadic-neologd` | IPAdic + NEologd |
            | `ipadic-neologd-sudachi` | IPAdic + NEologd + SudachiDict (recommended) |

            Each dictionary is attached as `<name>.hsd`. `<name>.hsd.zst` is the same dictionary compressed with zstd; `hasami dict download` fetches it and checks the SHA-256 after decompressing. `dictionaries.json` lists the dictionaries with their sizes and SHA-256, and `SHA256SUMS` covers every file of this release.

            To download a dictionary with curl and verify it:

            ```bash
            base=https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}
            curl -fL --remote-name-all "$base/ipadic-neologd-sudachi.hsd" "$base/SHA256SUMS"
            grep ' ipadic-neologd-sudachi.hsd$' SHA256SUMS | sha256sum --check --strict -
            ```

            The dictionaries contain data from IPAdic, mecab-ipadic-NEologd and SudachiDict. Their licenses are in `THIRD_PARTY_LICENSES.md`; distribute it together with the dictionaries when you redistribute them.
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

      # 公開した添付が release/ と名前・大きさ・状態まで一致するか（アップロードの取りこぼしを見つける）。
      # GitHub がアップロード時に計算した SHA-256（digest）を返していれば、それも照らす
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets > "${RUNNER_TEMP}/assets.json"
          find release -type f -printf '%f %s uploaded\n' | LC_ALL=C sort > "${RUNNER_TEMP}/expected.txt"
          jq -r '.assets[] | "\(.name) \(.size) \(.state)"' "${RUNNER_TEMP}/assets.json" | LC_ALL=C sort \
            > "${RUNNER_TEMP}/published.txt"
          if ! diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/published.txt"; then
            echo "::error::The published assets differ from the files in release/"
            exit 1
          fi

          jq -r '.assets[] | select(.digest != null) | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
            "${RUNNER_TEMP}/assets.json" > "${RUNNER_TEMP}/published.sha256"
          if [ -s "${RUNNER_TEMP}/published.sha256" ]; then
            (cd release && sha256sum --check --strict --quiet "${RUNNER_TEMP}/published.sha256")
          else
            echo "::warning::GitHub returned no asset digests; skipped the SHA-256 comparison"
          fi

  # 途中のジョブが落ちても、飛ばされても（dry_run を含む）結果を書く
  release-summary:
    name: Release summary
    needs: [prepare-release, build, dictionaries, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Write the summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DICTIONARIES_RESULT: ${{ needs.dictionaries.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          ASSETS: ${{ needs.release.outputs.assets }}
        run: |
          set -euo pipefail
          {
            if [ "${DRY_RUN}" = "true" ]; then
              echo "## Dry run: ${TAG:-no version}"
              echo
              echo "prepare-release: ${PREPARE_RESULT}. Nothing was committed, tagged or released, and neither the build nor the dictionaries ran (ci.yml builds every target; dict-build.yml builds the dictionaries)."
              exit 0
            fi
            echo "## ${TAG:-no version}"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| prepare-release | ${PREPARE_RESULT} |"
            echo "| build | ${BUILD_RESULT} |"
            echo "| dictionaries | ${DICTIONARIES_RESULT} |"
            echo "| release | ${RELEASE_RESULT} |"
            if [ -n "${ASSETS:-}" ]; then
              echo
              echo "Assets of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}:"
              echo
              read -r -a assets <<< "${ASSETS}"
              for asset in "${assets[@]}"; do
                echo "- \`${asset}\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
