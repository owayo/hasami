name: Update Dictionary Sources

on:
  # 毎日 JST 11:23。新版が公開されたら、リリースを待たずに取得版を更新する。
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 検証と artifact の保存まで実行し、コミット・push はしない
        type: boolean
        default: false
  workflow_call:
    secrets:
      HASAMI_DICTIONARIES_READ_KEY:
        description: 独自辞書リポジトリを読む deploy key
        required: true
    inputs:
      dry_run:
        description: 検証と artifact の保存まで実行し、コミット・push はしない
        type: boolean
        default: false
    outputs:
      source_ref:
        description: 最新の辞書ソースと例外表を記録したコミット
        value: ${{ jobs.commit.outputs.source_ref || jobs.resolve.outputs.source_ref }}

permissions:
  contents: read

concurrency:
  group: dictionary-source-updates
  cancel-in-progress: false

env:
  MISE_LOCKED: "1"

jobs:
  resolve:
    name: Resolve latest dictionary sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - name: Check the branch
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run source updates from $DEFAULT_BRANCH, or select dry_run"
            exit 1
          fi

      # リリース前の呼び出しでは、直前の更新で main が進んでいることがある。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-mise
        with:
          tools: python

      - name: Resolve upstream versions and SHA-256
        id: resolve
        run: |
          python3 -m unittest discover -s scripts -p 'test_dictionary_*.py'
          python3 scripts/dictionary_sources.py update
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- scripts/dictionary-sources.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff -- scripts/dictionary-sources.json
          fi

      - name: Upload candidate source versions
        if: ${{ steps.resolve.outputs.changed == 'true' || inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dictionary-sources
          path: scripts/dictionary-sources.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  validate:
    name: Build and validate updated dictionaries
    needs: resolve
    # dry_run では差分がなくても全手順を検証し、辞書と取得版を artifact に残す。
    if: ${{ needs.resolve.outputs.changed == 'true' || inputs.dry_run }}
    uses: ./.github/workflows/dict-build.yml
    secrets:
      HASAMI_DICTIONARIES_READ_KEY: ${{ secrets.HASAMI_DICTIONARIES_READ_KEY }}
    with:
      ref: ${{ needs.resolve.outputs.source_ref }}
      sources_artifact: dictionary-sources
      update_exceptions: true

  commit:
    name: Commit validated dictionary sources
    needs: [resolve, validate]
    if: ${{ !inputs.dry_run && needs.resolve.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.commit.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - uses: actions/download-artifact@v8
        with:
          name: dictionary-source-update
          path: ${{ runner.temp }}/dictionary-source-update

      - name: Commit and push
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/dictionary-source-update/scripts/dictionary-sources.json" scripts/dictionary-sources.json
          cp "$RUNNER_TEMP/dictionary-source-update/src/sentence/builtin_exceptions.txt" src/sentence/builtin_exceptions.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/dictionary-sources.json src/sentence/builtin_exceptions.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update dictionary sources'
            # 検証中にブランチが進んだ場合は失敗させる。検証していない状態へ rebase / force push しない。
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
