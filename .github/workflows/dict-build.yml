name: Build Dictionaries

# 配布辞書 (dict/*.hsd) を scripts/build-dict.sh で上流から作り直してコミットする。
# 上流の版はスクリプトで固定しているので、定期実行はせず、版や削除リストを変えたときに手で動かす。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-dict:
    name: Build Dictionaries
    runs-on: ubuntu-latest
    steps:
      # 既存の辞書は作り直すので LFS の実体は取らない (約 1.3GB の取得を省く)
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dict-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dict-

      - name: Build hasami
        run: cargo build --release

      - name: Build dictionaries
        run: scripts/build-dict.sh --hasami ./target/release/hasami

      - name: Show dictionary info
        run: |
          for hsd in dict/*.hsd; do
            echo "=== $(basename "$hsd") ==="
            ./target/release/hasami info --dict "$hsd"
            echo ""
          done

      - name: Commit dictionaries
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dict/ipadic.hsd dict/ipadic-neologd.hsd dict/ipadic-neologd-sudachi.hsd
          if git diff --staged --quiet; then
            echo "No dictionary changes detected"
          else
            git commit -m "chore: update pre-built dictionaries

          Built by scripts/build-dict.sh (IPAdic, mecab-ipadic-NEologd, SudachiDict)."
            git push
          fi
