name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # hasami-python は pyo3/extension-module のため Linux ではテストバイナリの
      # リンクに失敗する（未解決の libpython シンボル）。コンパイル検証は clippy
      # --workspace --all-targets 側でカバーする。
      - name: Run tests
        run: cargo test --workspace --exclude hasami-python --verbose

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ライブラリとして解析だけに使う構成（default-features = false）が CLI・CSV 系の依存なしで
      # ビルドでき、警告も出ないことを確かめる
      - name: Check library without default features
        run: |
          cargo clippy --lib --no-default-features -- -D warnings
          cargo test --lib --no-default-features

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
