name: Set up mise
description: mise.toml のツールのうち、ジョブに要るものだけを jdx/mise-action で入れる

# mise 本体は公開から 14 日以上たった最新の版を、署名付きの checksum で確かめて入れる (minimum_release_age)。
# 版は書かないので、日がたつと上がる。mise.lock があれば jdx/mise-action が mise install に --locked を付ける
# (lock の URL と SHA-256 で取る)。lock の書式 2 を読めるのは mise 2026.9.7 からなので、CI の mise がそれ以上に
# なるまで mise.lock は書式 1 のまま持つ (mise lock --upgrade しない。mise.toml の冒頭を参照)
inputs:
  tools:
    description: 入れるツール（mise install の引数。ジョブに要るものだけを挙げる）
    required: true

runs:
  using: composite
  steps:
    # キャッシュは使わない。rust は rustup が入れるので、mise のキャッシュだけ戻すと component が欠ける
    # (jdx/mise-action#215)。ビルドのキャッシュは Swatinem/rust-cache に任せる
    - uses: jdx/mise-action@v4
      with:
        minimum_release_age: 14d
        cache: false
        install_args: ${{ inputs.tools }}

    - name: Show tool versions
      shell: bash
      run: mise ls --current
