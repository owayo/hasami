[package]
name = "hasami-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "hasami_native"
crate-type = ["cdylib"]

[dependencies]
hasami = { path = "..", default-features = false, features = ["build"] }
pyo3 = { version = "0.30.1", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
