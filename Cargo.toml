[workspace]
members = [".", "hasami-python"]
resolver = "2"

[package]
name = "hasami"
version = "26.9.100"
edition = "2024"
description = "High-performance Japanese morphological analyzer"
license = "MIT"
rust-version = "1.85"

[lib]
name = "hasami"
path = "src/lib.rs"

[[bin]]
name = "hasami"
path = "src/main.rs"
required-features = ["cli"]

# ライブラリとして解析だけに使うなら default-features = false（依存は memmap2 と bytemuck だけ）
[features]
default = ["cli"]
# 辞書の構築・修復・書き出し（DictBuilder、MeCab 形式 CSV の読み書き、EUC-JP の変換）
build = ["dep:csv", "dep:encoding_rs", "dep:glob"]
# hasami コマンド
cli = ["build", "dep:clap", "dep:indicatif", "dep:serde_json"]

[dependencies]
memmap2 = "0.9.11"
bytemuck = { version = "1.25.2", features = ["derive"] }
csv = { version = "1.4.0", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
glob = { version = "0.3.4", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
indicatif = { version = "0.18.6", optional = true }
serde_json = { version = "1.0.151", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
