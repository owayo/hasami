# このリポジトリで使うツールの版。mise で入れられるものはここで固定する（ほかの版ファイルは置かない）
#
#   mise install   # 下のツールを入れる。取得するだけなので、mise activate していなければ mise exec -- <コマンド> で使う
#   MISE_GITHUB_TOKEN=$(gh auth token) mise lock --platform linux-x64,linux-arm64,macos-arm64,macos-x64,windows-x64
#                  # 版を変えたら mise.lock を作り直す（トークンが無いと GitHub API の制限で記録が黙って欠ける）
#
# mise.lock は書式 1（lockfile_version = 1）で持つ。CI の mise は jdx/mise-action の minimum_release_age: 14d で
# 決まる（公開から 14 日たった最新の版）。書式 2 を読めるのは 2026.9.7 からなので、CI の mise がそれ以上になるまで
# `mise lock --upgrade` はしない。lock は CI の mise と同じ版で作る（新しい mise も既存の書式 1 は保つ）
#
# 版は公開から 14 日たったものを選ぶ（リリース直後の版は乗っ取りが発覚する前に踏みうるため）。
# mise で入れられないものは OS のものを使う: zstd（Release の辞書の圧縮。GitHub のリリースに Linux・macOS の
# バイナリが無い）、git・curl・xz・unzip（scripts/build-dict.sh）

[tools]
# Cargo.toml の rust-version（MSRV）と同じ 1.98。CI も同じ版を使う。配布のターゲットは CI のジョブで足す。
# rust-src は rust-analyzer が標準ライブラリを辿るため
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy", "rust-src"] }
# scripts/*.py（辞書の作成）・eval/（uv。requires-python は >=3.12,<3.14）・hasami-python（maturin）
python = "3.13.15"
"aqua:astral-sh/uv" = "0.12.13"
"github:PyO3/maturin" = "1.15.0"

[env]
# eval/ の uv は mise の python を使う（.python-version は置かない。uv に Python を取らせない）
UV_PYTHON_PREFERENCE = "only-system"
