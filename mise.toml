# このリポジトリで使うツールの版。mise で入れられるものはここで固定する（ほかの版ファイルは置かない）
#
#   mise install   # 下のツールを入れる。取得するだけなので、mise activate していなければ mise exec -- <コマンド> で使う
#   MISE_GITHUB_TOKEN=$(gh auth token) mise lock --platform linux-x64,macos-arm64,macos-x64,windows-x64
#                  # 版を変えたら mise.lock を作り直す（トークンが無いと GitHub API の制限で記録が黙って欠ける）
#
# mise.lock は書式 1（lockfile_version = 1）で持つ。CI の mise（.github/actions/setup-mise）は書式 2 を読めない
# 2026.9.5 なので、`mise lock --upgrade` は CI の mise を 2026.9.7 以上に上げてから。新しい mise も既存の書式 1 は保つ
#
# 版は公開から 14 日たったものを選ぶ（リリース直後の版は乗っ取りが発覚する前に踏みうるため）。
# mise で入れられないものは OS のものを使う: zstd（Release の辞書の圧縮。GitHub のリリースに Linux・macOS の
# バイナリが無い）、git・curl・xz・unzip（scripts/build-dict.sh）。mise 自身の版は mise.toml に書けないので、
# CI の jdx/mise-action の version に書く

[tools]
# Cargo.toml の rust-version（MSRV）と同じ 1.98。CI も同じ版を使う。クロスビルドのターゲットは CI のジョブで足す。
# rust-src は rust-analyzer が標準ライブラリを辿るため
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy", "rust-src"] }
# scripts/*.py（辞書の作成）・eval/（uv。requires-python は >=3.12,<3.14）・hasami-python（maturin）
python = "3.13.15"
"aqua:astral-sh/uv" = "0.12.13"
"github:PyO3/maturin" = "1.15.0"
# CI の aarch64 Linux のクロスビルド（Linux だけ）。リリースの 0.2.5 は 2023 年で古いので、main の commit を固定する。
# リポジトリには cross と xtask の 2 つのバイナリがあるので crate で選ぶ。locked で cross の Cargo.lock のとおりに作る
"cargo:https://github.com/cross-rs/cross" = { version = "rev:8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27", crate = "cross", locked = true, os = ["linux"] }

[env]
# eval/ の uv は mise の python を使う（.python-version は置かない。uv に Python を取らせない）
UV_PYTHON_PREFERENCE = "only-system"
